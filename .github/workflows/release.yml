name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: UI
        working-directory: ui
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          # Keep runner paths (home folder, checkout) out of the binary.
          FLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=mieruka --remap-path-prefix=$HOME/.cargo=cargo"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            FLAGS="$FLAGS --remap-path-prefix=C:\\Users\\runneradmin\\.cargo=cargo -C link-arg=/PDBALTPATH:%_PDB% -C link-arg=/Brepro"
          fi
          RUSTFLAGS="$FLAGS" cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=mieruka-${{ matrix.target }}
          mkdir -p "pkg/$name" out
          cp LICENSE "pkg/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/mieruka.exe "pkg/$name/"
            # -tzip without extra fields: no NTFS times, owners or ACLs.
            (cd pkg && 7z a -tzip -mtc=off -mta=off "../out/$name.zip" "$name" > /dev/null)
          else
            cp target/${{ matrix.target }}/release/mieruka "pkg/$name/"
            # No runner user/group names or macOS extended attributes in the archive.
            if tar --version | grep -q GNU; then
              tar -C pkg --owner=0 --group=0 --numeric-owner -czf "out/$name.tar.gz" "$name"
            else
              COPYFILE_DISABLE=1 tar -C pkg --no-xattrs --no-mac-metadata --uid 0 --gid 0 --uname "" --gname "" -czf "out/$name.tar.gz" "$name"
            fi
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          (cd out && sha256sum * > SHA256SUMS)
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "mieruka ${{ github.ref_name }}" "$@"
