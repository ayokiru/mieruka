[package]
name = "mieruka"
version = "0.2.0"
edition = "2024"
description = "See what your coding agent sees: a workspace for agent Markdown"
license = "MIT"
repository = "https://github.com/ayokiru/mieruka"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.59.0", default-features = false }
ignore = "0.4.34"
mime_guess = "2.0.5"
open = "5.4.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2.0"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
