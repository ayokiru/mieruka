[package]
name = "mieruka"
version = "0.2.1"
edition = "2024"
description = "See which instruction files your coding agents load, and what changed in them"
license = "MIT"
repository = "https://github.com/ayokiru/mieruka"
readme = "README.md"
keywords = ["claude-code", "codex", "cursor", "agents-md", "markdown"]
categories = ["command-line-utilities", "development-tools"]
# ui/dist is git-ignored but must ship: the binary embeds it. Build it before packaging.
include = ["/src", "/ui/dist", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.59.0", default-features = false }
ignore = "0.4.34"
mime_guess = "2.0.5"
open = "5.4.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
toml = "1.2.0"
walkdir = "2.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
