ShortDescription: See which instruction files your coding agents load, and what changed in them.
Description: |-
  mieruka is a local app for the Markdown files coding agents read: Claude Code, Codex,
  Cursor, GitHub Copilot and Antigravity. It shows which files each agent loads, flags
  broken paths and imports, and lets you accept or revert edits agents make to them.
  `mieruka check` runs the same checks in CI.
